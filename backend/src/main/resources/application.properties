server.port=8080

# In-memory H2 database (data resets on restart). Switch to PostgreSQL/MySQL for production.
spring.datasource.url=jdbc:h2:mem:jobtrackr
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Origin of the Angular dev server
app.cors.allowed-origin=http://localhost:4200
